# YOLO 检测配置
# ⚠️ 重要：相对路径相对于 /training/configs 目录

# 模型配置
model:
  # 模型大小: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  size: "yolov8m"

  # 模型权重路径
  weights: "../model/yolov8m.pt"

  # 是否使用预训练权重
  pretrained: true

# 检测参数
yolo_detection:
  # 置信度阈值 (0-1)
  conf_threshold: 0.5

  # IoU阈值（NMS）
  iou_threshold: 0.45

  # 最大检测数量
  max_det: 300

  # COCO数据集类别ID
  airplane_class_id: 4

  # 是否只检测飞机类别
  classes: [4]  # None表示检测所有类别，[4]表示只检测飞机

# 推理配置
yolo_inference:
  # 推理设备
  device: "cuda"  # cuda, cpu, 或具体GPU如 cuda:0

  # 批次大小
  batch_size: 1

  # 图片尺寸
  image_size: 640

  # 是否使用半精度（FP16）
  half: false

  # 是否显示详细信息
  verbose: false

# 注意：YOLO 训练配置已移至 training.yaml，避免配置重复和冲突
