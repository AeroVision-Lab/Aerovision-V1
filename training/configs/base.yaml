# AeroVision-V1 全局基础配置
# ⚠️ 重要：所有相对路径都相对于 /training/configs 目录
# 无论在哪里运行脚本，../data 都表示 /training/data

# ========== 项目基础信息 ==========
project:
  name: "AeroVision-V1"
  version: "0.1.0"
  description: "航空摄影智能审核系统"

# ========== 设备配置 ==========
device:
  # 训练和推理设备
  default: "cuda"  # cuda 或 cpu
  # GPU设置
  gpu_ids: [0]  # 使用的GPU ID列表
  # 多GPU训练
  distributed: false

# ========== 图像预处理 ==========
image:
  # 支持的图片格式
  extensions:
    - "*.jpg"
    - "*.jpeg"
    - "*.png"
    - "*.JPG"
    - "*.JPEG"
    - "*.PNG"
    - "*.bmp"
    - "*.BMP"

  # 默认图片尺寸
  default_size: 640

  # 图片质量
  jpeg_quality: 100

# ========== 随机种子 ==========
seed:
  random: 42
  numpy: 42
  torch: 42

# ========== 实验跟踪 ==========
experiment:
  # 是否启用wandb
  use_wandb: false
  wandb_project: "aerovision-v1"
  wandb_entity: null  # 你的wandb用户名或团队名

  # 是否启用tensorboard
  use_tensorboard: true

  # 实验标签
  tags: []

# ========== 输出路径配置 ==========
# 训练输出、检查点、日志的默认路径
path_output:
  # 训练输出根目录
  root: "../output"

  # 分类训练输出
  classify: "../output/classify"

  # 航司训练输出
  airline: "../output/airline"

  # 检测训练输出
  detection: "../output/detection"

# 检查点保存路径
checkpoints:
  # 检查点根目录
  root: "../ckpt"

  # 分类模型检查点
  classify: "../ckpt/classify"

  # 航司模型检查点
  airline: "../ckpt/airline"

  # 检测模型检查点
  detection: "../ckpt/detection"

# 日志路径
logs:
  # 日志根目录
  root: "../logs"

  # 分类训练日志
  classify: "../logs/classify"

  # 航司训练日志
  airline: "../logs/airline"

  # 检测训练日志
  detection: "../logs/detection"

  # 裁剪审查日志
  crop_review: "../logs/crop_review_{timestamp}.png"
